  - aid: storylane:storylane-mcp
    name: Storylane MCP Server
    description: >
      Storylane's first-party hosted Model Context Protocol server, the widest
      programmatic surface the company operates. It exposes 22 documented tools
      covering demo analytics, engaged accounts and captured leads; the demo
      library across workspaces; demo creation from screenshots or screen
      recordings; AI personalization of demo variants; publishing; Demo Hubs;
      share links; and AI narration voices. Authentication is OAuth 2.0 with
      RFC 8414 authorization server metadata, RFC 7591 dynamic client
      registration and PKCE S256, so an MCP client can self-provision with no
      manual step. Claude, ChatGPT and Microsoft Copilot are named as supported
      clients. Seventeen of its tools have no publicly documented REST
      equivalent.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.storylane.io/integrations/integrations-and-data-flow/mcp
    baseURL: https://identity.storylane.io/mcp
    tags:
      - MCP
      - Agent Tools
      - Demos
      - Analytics
      - OAuth
    properties:
      - type: MCPServer
        url: mcp/storylane-mcp.yml
      - type: ToolCrosswalk
        url: mcp/storylane-tool-crosswalk.yml
      - type: Documentation
        url: https://docs.storylane.io/integrations/integrations-and-data-flow/mcp
      - type: OAuthScopes
        url: scopes/storylane-scopes.yml
      - type: Authentication
        url: authentication/storylane-authentication.yml
      - type: WellKnown
        url: well-known/storylane-well-known.yml
      - type: AgentSkill
        url: skills/_index.yml

  - aid: storylane:storylane-oembed-api
    name: Storylane oEmbed API
    description: >
      A public, unauthenticated oEmbed 1.0 provider endpoint that resolves any
      Storylane demo share URL into a rich embed response containing the demo
      title, provider metadata, a preview thumbnail, and the ready-to-paste
      embed HTML with its iframe and loader script. It is the only Storylane
      API endpoint callable with no credential of any kind, and the only one
      whose exact request path the company publishes. Documented as compatible
      with iFramely and Embedly.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.storylane.io/sharing-demos/embed-on-website-or-product
    baseURL: https://api.storylane.io
    tags:
      - oEmbed
      - Embeds
      - Public
    properties:
      - type: Documentation
        url: https://docs.storylane.io/sharing-demos/embed-on-website-or-product
      - type: Components
        url: components/storylane-components.yml
      - type: Conformance
        url: conformance/storylane-conformance.yml

  - aid: storylane:storylane-webhooks
    name: Storylane Webhooks and Demo Events
    description: >
      Storylane's event surface, in two channels. Outbound HTTPS webhooks
      deliver completed demo sessions to a customer endpoint, signed with a
      base64 HMAC-SHA256 of the raw body in an x-storylane-signature header,
      carrying completion, dwell time, intent level, location, UTM parameters,
      captured lead identity and firmographic buyer reveal. In the browser, an
      embedded demo iframe emits cross-frame postMessage analytics events
      (demo_open, step_view, demo_finished, lead_identify, open_external_url)
      to its host page, and accepts an inbound cookie-consent message that
      gates tracking for GDPR. Available from the Starter plan.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.storylane.io/integrations/integrations-and-data-flow/webhooks
    baseURL: https://api.storylane.io
    tags:
      - Webhooks
      - Events
      - Analytics
      - Lead Capture
    properties:
      - type: Webhooks
        url: asyncapi/storylane-webhooks.yml
      - type: Documentation
        url: https://docs.storylane.io/integrations/integrations-and-data-flow/webhooks
      - type: DataModel
        url: data-model/storylane-data-model.yml
      - type: AgentSkill
        url: skills/storylane-verify-webhook.md
