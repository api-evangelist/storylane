finding: >
  Storylane's integration story is deliberately no-code: an embed snippet, an
  oEmbed URL, 30-plus native SaaS integrations, Zapier, webhooks, and now a
  remote MCP server. There is no SDK because there is almost no addressable REST
  API — the External API is Enterprise-gated with manually issued credentials.
  The absence here is a strategy, not decay.
