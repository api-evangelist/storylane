      - list_demos
      - get_demo
      - get_demo_status
      - list_hubs
      - get_hub
      - list_links
      - list_voices
  - name: demos_write
    description: >
      Write access to demos and share links. Aligns with the documented write
      tools convert_images_to_demo, convert_video_to_demo, add_step,
      personalise_demo, update_demo_settings, publish_demo, create_link and
      update_link. Storylane's ChatGPT setup notes that write actions require
      Developer Mode, which is in beta for Business and Enterprise plans.
    source: authorization-server-metadata
    tools_inferred:
      - convert_images_to_demo
      - convert_video_to_demo
      - add_step
      - personalise_demo
      - update_demo_settings
      - publish_demo
      - create_link
      - update_link
  - name: analytics_read
    description: >
      Read access to demo engagement analytics, captured leads and engaged
