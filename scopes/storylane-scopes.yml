description: >
  OAuth 2.0 scopes Storylane publishes in its RFC 8414 Authorization Server
  Metadata at identity.storylane.io. These are the scopes an MCP client requests
  when a user authorizes Claude, ChatGPT or another MCP-capable client against
  the Storylane MCP server. Scope descriptions below are derived from the
  scope names and the documented MCP tool categories — Storylane does not
  publish a per-scope permissions reference page, so no description here is
  quoted from the provider.
