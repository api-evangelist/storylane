notes:
  - >
    Scope-to-tool mapping is INFERRED from scope names against the provider's
    published tool catalog. Storylane publishes no scopes reference page, so the
    mapping is a reasonable reading, not a provider statement.
  - >
    All scopes are additionally workspace-scoped at runtime: the docs state every
    tool is limited to the authenticated user's active workspace and their own
    permissions within it.
  - >
    The External REST API does NOT use these scopes. It authenticates with a
    support-issued Bearer access_token plus a workspace_id and has no scope model.
