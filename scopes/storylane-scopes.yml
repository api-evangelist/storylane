registration_endpoint: https://identity.storylane.io/oauth/register
grant_types_supported:
  - authorization_code
  - client_credentials
  - refresh_token
code_challenge_methods_supported:
  - S256
token_endpoint_auth_methods_supported:
  - none
  - client_secret_post
scope_count: 4
scopes:
  - name: mcp
    description: >
      Access to the Storylane MCP server transport itself. Published in the
      authorization server metadata; required to reach
      https://identity.storylane.io/mcp.
    source: authorization-server-metadata
  - name: demos_read
    description: >
      Read access to the demo library. Aligns with the documented read tools
      list_workspaces, list_demos, get_demo, get_demo_status, list_hubs,
      get_hub, list_links and list_voices.
    source: authorization-server-metadata
    tools_inferred:
