  security_contact: none published
  security_txt: false
changelog:
  url: https://docs.storylane.io/changelog
  cadence: approximately twice monthly
  latest_entry: '2026-07-28'
  api_changes_recorded: false
  detail: changelog/storylane-changelog.yml
maturity:
  external_rest_api:
    stage: limited availability
    evidence: >
      Enterprise plan only; credentials issued manually by support; request paths
      and parameters unpublished; no OpenAPI; no SDK.
  mcp_server:
    stage: generally available, actively expanding
    evidence: >
      Publicly documented with 22 tools, OAuth with dynamic client registration,
      named support for Claude, ChatGPT and Microsoft Copilot, and listed as a
      paid plan feature. Hub creation and editing are documented as "coming soon",
      so the surface is explicitly still growing.
  webhooks:
    stage: generally available
    evidence: Starter plan and above, with signed payloads and reference verification code.
  embed_and_oembed:
    stage: generally available
    evidence: Anonymous, documented, and the primary distribution mechanism.
gaps:
  - No API versioning scheme of any kind.
  - No deprecation or sunset policy, and no Sunset/Deprecation headers.
  - No published SLA or uptime commitment.
  - No status page component covering the External API or the MCP endpoint.
  - No security contact or vulnerability disclosure channel (see security/storylane-vulnerability-disclosure.yml).
  - The changelog records product changes only; contract changes are not announced anywhere.
