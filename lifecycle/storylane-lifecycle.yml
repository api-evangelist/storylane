generated: '2026-08-13'
method: probed
source: >
  Live probes of https://status.storylane.io/api/v2/status.json and
  /api/v2/summary.json, plus https://docs.storylane.io/changelog and the
  External API, MCP and embed documentation.
description: >
  Storylane's API lifecycle posture. It publishes a real, machine-readable status
  page and a dated product changelog, and nothing else: no versioning scheme, no
  deprecation policy, no sunset signaling, no public SLA. The one live example of
  a deprecation-shaped event on the platform — the v1 embed loader still being
  served alongside v2 with no notice — is the shape of the gap.
versioning:
  scheme: none
  url_versioning: false
  header_versioning: false
  published_policy: false
  note: >
    No documented Storylane API URL carries a version segment. The oEmbed path is
    /oembed/meta and the MCP path is /mcp. The only versioned artifacts are the
    browser embed loaders at /js/v1/ and /js/v2/.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  advance_notice_period: null
  deprecated_operations: []
  observed_deprecation_shaped_event:
    what: js.storylane.io/js/v1/storylane.js
    status: still served (HTTP 200, 2026-08-13)
    successor: js.storylane.io/js/v2/storylane.js
    evidence: >
      www.storylane.io loads v2, but the live oEmbed response at
      https://api.storylane.io/oembed/meta still emits a v1 script tag in its
      html field. Two loader generations are in production simultaneously with no
      published deprecation notice, migration guide or end-of-life date for v1.
    note: >
      Not recorded as a deprecation — Storylane has never called it one. Recorded
      as the evidence that no deprecation process exists.
