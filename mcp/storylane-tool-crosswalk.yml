method: derived
source: >
  mcp/storylane-mcp.yml (22 published MCP tools) bound against the five REST
  operations documented at
  https://docs.storylane.io/integrations/integrations-and-data-flow/external-api
  and the public oEmbed endpoint documented at
  https://docs.storylane.io/sharing-demos/embed-on-website-or-product
description: >
  Crosswalk between Storylane's remote MCP tool surface and its documented REST
  surface. Storylane publishes NO OpenAPI, so the REST side of this map is not
  operationIds from a spec — it is the five operations the External API
  documentation names and shows sample responses for, plus one public oEmbed
  endpoint. Identifiers below are therefore doc-derived labels, not spec
  operationIds, and every row records that honestly.
  THE HEADLINE: the agent surface is four times the documented REST surface.
  17 of 22 MCP tools have no publicly documented REST equivalent — demo creation
  from media, AI personalization, publishing, hubs, voices, analytics, leads and
  accounts are all reachable by an agent and none of them are reachable by a
  developer reading the public REST docs.
surfaces:
  openapi:
    present: false
    note: >
      No OpenAPI or Swagger document was found on api.storylane.io,
      identity.storylane.io, docs.storylane.io or www.storylane.io. The External
      API's request paths and parameters are not published at all; the docs show
      only sample response bodies and direct readers to a Postman collection
      that renders client-side.
  rest:
    documented_at: https://docs.storylane.io/integrations/integrations-and-data-flow/external-api
    base_url: https://api.storylane.io
    gated: true
    gate: >
      Enterprise plan only. workspace_id and access_token are issued manually by
      support@storylane.io; there is no self-serve key.
    auth: Bearer token + workspace identifier
  oembed:
    endpoint: https://api.storylane.io/oembed/meta?url=<demo-url>
    gated: false
    verified: probed
    http_status: 200
    note: The one Storylane REST endpoint callable with no credentials at all.
  graphql:
    present: false
  mcp:
    endpoint: https://identity.storylane.io/mcp
    gated: true
    gate: OAuth; tools/list returns 401 Bearer realm="Storylane MCP"
    tools: 22
crosswalk:
  - tool: list_demos
    category: demo-library
    rest:
      - listPublishedDemos
    binding: direct
    confidence: high
    note: >
      REST operation "All Published Demos" returns {demos:[...]}. The MCP tool
      additionally documents filtering and search, which the REST docs do not.
  - tool: get_demo
    category: demo-library
    rest:
      - getDemo
    binding: direct
    confidence: high
    note: >
      REST operation "Get Details on a Single Demo" returns {demo:{chapters,
      steps, ...}}, matching the tool's documented "steps, hotspots, embed
      settings, and share links".
  - tool: list_links
    category: links
    rest:
      - listDemoLinks
    binding: direct
    confidence: high
    note: >
      REST operation "List Demo Links" returns {links:[...]}. The MCP tool also
      claims view counts, which the documented REST link object does not carry.
  - tool: create_link
    category: links
    rest:
      - createDemoLink
    binding: direct
    confidence: high
    note: >
      REST operation "Create a New Demo Link" returns {link:{...}} with passcode,
      expires_at, email_required and whitelist_email_domains.
  - tool: update_link
    category: links
    rest:
      - updateDemoLink
    binding: direct
    confidence: high
    note: REST operation "Update an Existing Demo Link" returns {link:{...}}.
  - tool: get_demo_status
    category: demo-library
    rest:
      - getDemo
    binding: partial
    confidence: low
    note: >
      The documented demo object carries a status field (published / amended)
      and published_at, so publish state is readable via getDemo. Processing
      status has no documented REST equivalent.
